plugins { id 'com.android.application' }

android {
    namespace 'app.minichat'
    compileSdk 34
    defaultConfig {
        applicationId 'app.minichat'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            def ks = System.getenv('MINICHAT_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('MINICHAT_KS_PASS')
                keyAlias 'minichat'
                keyPassword System.getenv('MINICHAT_KS_PASS')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (System.getenv('MINICHAT_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions { unitTests { includeAndroidResources = true } }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
}

tasks.withType(Test).configureEach {
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
}
