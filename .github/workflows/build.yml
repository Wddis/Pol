name: Build APK

on:
  push:
    branches: [ main, 'claude/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # NDK понадобится на этапе 3 (tun2socks):
      # - name: Install NDK
      #   run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;<версия>"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: vpn-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
