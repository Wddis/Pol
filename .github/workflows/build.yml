name: Build APK

on:
  push:
    branches: [ main, 'claude/**' ]
  workflow_dispatch:
    inputs:
      test_key:
        description: "Тестовый ключ ODA (на несколько минут) — проверка интерфейса в эмуляторе Android (job «ui»)"
        required: false
        default: ""
      release:
        description: "Выпустить APK: GitHub Release vX.Y.Z и страница загрузки бота (…/download)"
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # id-token — токен OIDC для сервера бота (ключ подписи, выпуск); contents — GitHub Release
    permissions:
      contents: write
      id-token: write
    env:
      ODA_SERVER: https://oda-vpn-bot.dimazoltinsky.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # JDK 25: tor-android 0.4.9.14 собран под Java 24+.
      # Исходники приложения остаются на уровне Java 17.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # Логика выбора стратегии обхода DPI и строки ByeDPI — на компьютере, за секунды
      - name: Test DPI bypass strategies
        run: bash scripts/test-bypass.sh

      # Лицензия ключа в приложении: Ed25519 на Java (векторы RFC 8032) против кода подписи сервера ключей,
      # защита от подделки срока, чужого телефона, перевода часов назад
      - name: Test key licenses (Ed25519, License.java)
        run: bash scripts/test-license.sh

      # Telegram-бот и сервер ключей на Cloudflare Workers (bot/worker): имитация пользователей Telegram,
      # администратора и телефонов против локального воркера с D1
      - name: Test Telegram bot on Cloudflare Workers (simulation)
        run: |
          cd bot/worker
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          node test/run.mjs

      # Имитация телефона: VPN-интерфейс → tun2socks → ByeDPI → «оператор» с DPI → «интернет»,
      # с нагрузкой DNS как у телефона (ошибка 0.8.5: «подключено», а интернета нет)
      - name: Simulate phone traffic through tun2socks and ByeDPI
        run: |
          sudo python3 -m pip install --quiet --break-system-packages pyroute2
          sudo -E env "PATH=$PATH" bash scripts/test-tun.sh

      # NDK для tun2socks: Android Gradle Plugin сам ставит нужную версию
      # через sdkmanager, если её нет на раннере.

      # Свой клиент Snowflake с маскировкой DTLS (covert-dtls) и Psiphon: Go + NDK раннера
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Build Snowflake client
        run: bash scripts/build-snowflake.sh

      - name: Build Psiphon client and server list
        run: bash scripts/build-psiphon.sh

      - name: Build ByeDPI (DPI bypass)
        run: bash scripts/build-byedpi.sh

      # Постоянный ключ подписи: APK ставится поверх старой версии. В публичном репозитории ключа нет —
      # сервер бота отдаёт его только по токену OIDC, который GitHub выдаёт workflow этого репозитория
      - name: ODA signing key
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::warning::Нет токена OIDC (форк или pull request) — APK с отладочным ключом"; exit 0
          fi
          TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=oda-ci" | jq -r .value)
          if ! curl -sSf -X POST -H "Authorization: Bearer $TOKEN" "$ODA_SERVER/ci/signing-key" -o "$RUNNER_TEMP/k.json"; then
            echo "::warning::Сервер не выдал ключ подписи — APK с отладочным ключом"; exit 0
          fi
          PASS=$(jq -r .password "$RUNNER_TEMP/k.json")
          ALIAS=$(jq -r .alias "$RUNNER_TEMP/k.json")
          echo "::add-mask::$PASS"
          jq -r .keystore "$RUNNER_TEMP/k.json" | base64 -d > "$RUNNER_TEMP/oda.p12"
          rm -f "$RUNNER_TEMP/k.json"
          {
            echo "ODA_KEYSTORE=$RUNNER_TEMP/oda.p12"
            echo "ODA_KEYSTORE_PASS=$PASS"
            echo "ODA_KEY_ALIAS=$ALIAS"
          } >> "$GITHUB_ENV"
          echo "ключ подписи ODA получен"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Check Snowflake and Psiphon in APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -E 'libsnowflake.so|libpsiphon.so|libbyedpi.so|psiphon/server_list.txt'
          test "$(unzip -l "$APK" | grep -c libsnowflake.so)" -eq 2
          test "$(unzip -l "$APK" | grep -c libpsiphon.so)" -eq 2
          test "$(unzip -l "$APK" | grep -c libbyedpi.so)" -eq 2
          test "$(unzip -l "$APK" | grep -c assets/psiphon/server_list.txt)" -eq 1

      - name: Check tun2socks in APK (JNI class, oda-hev.h)
        run: |
          # В 0.8.9 флаги Application.mk потерялись: JNI_OnLoad искал чужой класс, приложение падало
          APK=app/build/outputs/apk/debug/app-debug.apk
          for abi in arm64-v8a armeabi-v7a; do
            unzip -p "$APK" "lib/$abi/libhev-socks5-tunnel.so" > "$RUNNER_TEMP/hev.so"
            grep -qa 'com/example/vpnapp/Tun2Socks' "$RUNNER_TEMP/hev.so"
            grep -qa 'oda-hev: MSG_MORE=0 NODELAY=1' "$RUNNER_TEMP/hev.so"
            echo "$abi: JNI-класс и oda-hev.h на месте"
          done

      # Подпись: ключ ODA (сертификат CN=ODA) — иначе обновление поверх старой версии не встанет
      - name: Check APK signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$SIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          if grep -q 'CN=ODA' "$RUNNER_TEMP/certs.txt"; then
            echo "подпись ODA (постоянная): $(grep -m1 'SHA-256' "$RUNNER_TEMP/certs.txt")"
          elif [ "${{ inputs.release }}" = "true" ]; then
            echo "::error::Выпуск только с подписью ODA"; exit 1
          else
            echo "::warning::APK с отладочным ключом — поверх версии с подписью ODA не встанет"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: vpn-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Телефонный APK — в сторону: сборка для эмулятора ниже перезапишет app-debug.apk
      - name: Keep phone APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/phone.apk"

      # Для эмулятора (job «ui») — отдельный APK x86_64: под трансляцией ARM→x86 в эмуляторе падает Go
      # (Psiphon, IPtProxy), а на телефонах ARM её нет. Телефонный APK выше не меняется.
      - name: Build emulator APK (x86_64)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_key != '' }}
        env:
          ODA_ABIS: x86_64
        run: |
          bash scripts/build-snowflake.sh
          bash scripts/build-psiphon.sh
          bash scripts/build-byedpi.sh
          ./gradlew assembleDebug -PodaEmulator --stacktrace
          APK=app/build/outputs/apk/debug/app-debug.apk
          for lib in libsnowflake.so libpsiphon.so libbyedpi.so libhev-socks5-tunnel.so libgojni.so; do
            unzip -l "$APK" | grep -q "lib/x86_64/$lib" || { echo "нет lib/x86_64/$lib"; exit 1; }
          done
          if unzip -l "$APK" | grep -q 'lib/arm64-v8a/'; then echo "в APK эмулятора попал ARM"; exit 1; fi
          cp "$APK" "$RUNNER_TEMP/app-emulator.apk"

      - name: Upload emulator APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_key != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: vpn-app-emulator
          path: ${{ runner.temp }}/app-emulator.apk
          if-no-files-found: error

      # Выпуск: телефонный APK (ARM 32 и 64 бит) → GitHub Release vX.Y.Z → страница загрузки бота
      - name: Release APK (GitHub Release + bot download page)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP "versionName = '\K[^']+" app/build.gradle)
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle)
          APK="$RUNNER_TEMP/ODA-$V.apk"
          cp "$RUNNER_TEMP/phone.apk" "$APK"
          NOTES="ODA $V для Android 7+ (32 и 64 бит). Установка и обновление — $ODA_SERVER/download (ставится поверх старой версии)."
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "$APK" --clobber
          else
            gh release create "v$V" "$APK" --target "$GITHUB_SHA" --title "ODA $V" --notes "$NOTES"
          fi
          SIZE=$(stat -c %s "$APK")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v$V/ODA-$V.apk"
          TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=oda-ci" | jq -r .value)
          curl -sSf -X POST -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d "{\"version\":\"$V\",\"code\":$CODE,\"url\":\"$URL\",\"size\":$SIZE,\"sha256\":\"$SHA\"}" "$ODA_SERVER/ci/release"
          echo
          # Страница отдаёт тот же файл
          test "$(curl -sSfL "$ODA_SERVER/download/ODA-$V.apk" | sha256sum | cut -d' ' -f1)" = "$SHA"
          echo "выпущено: ODA $V — $ODA_SERVER/download"

  # Интерфейс в эмуляторе Android (на раннерах GitHub есть KVM): APK из job «build», тестовый ключ из запуска
  # вручную; scripts/ui-test.py проходит экраны как человек, скриншоты — в журнале (@@SHOT) и артефакте
  # Два современных эмулятора параллельно: Android 15 (API 35) и Android 16 (API 36), Pixel 8.
  # Тестовый ключ — на 2 устройства (каждый эмулятор — своё устройство)
  ui:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_key != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download APK
        uses: actions/download-artifact@v7
        with:
          name: vpn-app-emulator
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          python3 -m pip install --quiet --break-system-packages pillow || python3 -m pip install --quiet pillow

      - name: UI test in Android ${{ matrix.api }} emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TEST_KEY: ${{ inputs.test_key }}
          TEST_KEY_SECONDS: '600'
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_8
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/ui-test.py apk/app-emulator.apk "$TEST_KEY" ui-shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-shots-android-${{ matrix.api }}
          path: ui-shots
          if-no-files-found: ignore
