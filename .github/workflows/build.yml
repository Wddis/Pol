name: Build APK

on:
  push:
    branches: [ main, 'claude/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # JDK 25: tor-android 0.4.9.14 собран под Java 24+.
      # Исходники приложения остаются на уровне Java 17.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # NDK для tun2socks: Android Gradle Plugin сам ставит нужную версию
      # через sdkmanager, если её нет на раннере.

      # Свой клиент Snowflake с маскировкой DTLS (covert-dtls): Go + NDK раннера
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Build Snowflake client
        run: bash scripts/build-snowflake.sh

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Check Snowflake client in APK
        run: |
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep libsnowflake.so
          test "$(unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -c libsnowflake.so)" -eq 2

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: vpn-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
