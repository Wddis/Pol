name: Build APK

on:
  push:
    branches: [ main, 'claude/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # JDK 25: tor-android 0.4.9.14 собран под Java 24+.
      # Исходники приложения остаются на уровне Java 17.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # Логика выбора стратегии обхода DPI и строки ByeDPI — на компьютере, за секунды
      - name: Test DPI bypass strategies
        run: bash scripts/test-bypass.sh

      # Лицензия ключа в приложении: Ed25519 на Java (векторы RFC 8032) против кода подписи сервера ключей,
      # защита от подделки срока, чужого телефона, перевода часов назад
      - name: Test key licenses (Ed25519, License.java)
        run: bash scripts/test-license.sh

      # Telegram-бот и сервер ключей на Cloudflare Workers (bot/worker): имитация пользователей Telegram,
      # администратора и телефонов против локального воркера с D1
      - name: Test Telegram bot on Cloudflare Workers (simulation)
        run: |
          cd bot/worker
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          node test/run.mjs

      # Имитация телефона: VPN-интерфейс → tun2socks → ByeDPI → «оператор» с DPI → «интернет»,
      # с нагрузкой DNS как у телефона (ошибка 0.8.5: «подключено», а интернета нет)
      - name: Simulate phone traffic through tun2socks and ByeDPI
        run: |
          sudo python3 -m pip install --quiet --break-system-packages pyroute2
          sudo -E env "PATH=$PATH" bash scripts/test-tun.sh

      # NDK для tun2socks: Android Gradle Plugin сам ставит нужную версию
      # через sdkmanager, если её нет на раннере.

      # Свой клиент Snowflake с маскировкой DTLS (covert-dtls) и Psiphon: Go + NDK раннера
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Build Snowflake client
        run: bash scripts/build-snowflake.sh

      - name: Build Psiphon client and server list
        run: bash scripts/build-psiphon.sh

      - name: Build ByeDPI (DPI bypass)
        run: bash scripts/build-byedpi.sh

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Check Snowflake and Psiphon in APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -E 'libsnowflake.so|libpsiphon.so|libbyedpi.so|psiphon/server_list.txt'
          test "$(unzip -l "$APK" | grep -c libsnowflake.so)" -eq 2
          test "$(unzip -l "$APK" | grep -c libpsiphon.so)" -eq 2
          test "$(unzip -l "$APK" | grep -c libbyedpi.so)" -eq 2
          test "$(unzip -l "$APK" | grep -c assets/psiphon/server_list.txt)" -eq 1

      - name: Check tun2socks in APK (JNI class, oda-hev.h)
        run: |
          # В 0.8.9 флаги Application.mk потерялись: JNI_OnLoad искал чужой класс, приложение падало
          APK=app/build/outputs/apk/debug/app-debug.apk
          for abi in arm64-v8a armeabi-v7a; do
            unzip -p "$APK" "lib/$abi/libhev-socks5-tunnel.so" > "$RUNNER_TEMP/hev.so"
            grep -qa 'com/example/vpnapp/Tun2Socks' "$RUNNER_TEMP/hev.so"
            grep -qa 'oda-hev: MSG_MORE=0' "$RUNNER_TEMP/hev.so"
            echo "$abi: JNI-класс и oda-hev.h на месте"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: vpn-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
