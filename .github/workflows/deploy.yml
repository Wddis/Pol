name: Deploy bot to The Vibe Hosting

# Секреты в репозитории не хранятся. Раннер создаёт одноразовую пару RSA-ключей,
# печатает публичный ключ в лог и ждёт зашифрованный пакет в ветке deploy-secrets
# (файл <run_id>.enc). Расшифровать его может только этот запуск — приватный ключ
# живёт лишь в памяти раннера.

on:
  workflow_dispatch:
    inputs:
      secrets_branch:
        description: "Ветка, куда будет положен зашифрованный пакет <run_id>.enc"
        required: true
        default: deploy-secrets

permissions:
  contents: write   # чтобы выложить публичный ключ в ветку deploy-secrets

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Create one-time key pair
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/k"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$RUNNER_TEMP/k/priv.pem" 2>/dev/null
          openssl pkey -in "$RUNNER_TEMP/k/priv.pem" -pubout -out "$RUNNER_TEMP/k/pub.pem"
          echo "RUN_ID=${GITHUB_RUN_ID}"
          echo "PUBKEY_BEGIN"
          base64 -w0 "$RUNNER_TEMP/k/pub.pem"; echo
          echo "PUBKEY_END"
          # Публикуем публичный ключ в ветку deploy-secrets (он не секретный)
          W="$RUNNER_TEMP/pubbranch"
          git init -q "$W" && cd "$W"
          git config user.name "deploy-bot" && git config user.email "deploy-bot@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q origin deploy-secrets 2>/dev/null; then git checkout -q -b deploy-secrets FETCH_HEAD; else git checkout -q --orphan deploy-secrets; fi
          cp "$RUNNER_TEMP/k/pub.pem" "${GITHUB_RUN_ID}.pub"
          git add "${GITHUB_RUN_ID}.pub" && git commit -q -m "pubkey for run ${GITHUB_RUN_ID}"
          git push -q origin HEAD:deploy-secrets

      - name: Wait for encrypted secrets
        run: |
          for i in $(seq 1 90); do
            if git fetch -q origin "${{ inputs.secrets_branch }}" 2>/dev/null && \
               git show "FETCH_HEAD:deploy/${GITHUB_RUN_ID}.enc" > "$RUNNER_TEMP/k/bundle.enc" 2>/dev/null; then
              echo "Got secrets bundle"; exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for secrets"; exit 1

      - name: Decrypt secrets
        run: |
          umask 077
          cd "$RUNNER_TEMP/k"
          # bundle.enc = base64( RSA-OAEP(aes_key) ) + "\n" + base64( AES-256-CBC(json) )
          sed -n 1p bundle.enc | base64 -d > key.rsa
          sed -n 2p bundle.enc | base64 -d > data.aes
          openssl pkeyutl -decrypt -inkey priv.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in key.rsa -out aes.key
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass file:aes.key -in data.aes -out secrets.json
          rm -f priv.pem aes.key key.rsa data.aes bundle.enc
          for k in TELEGRAM_TOKEN COARENA_API_KEY; do
            v=$(jq -r ".$k // empty" secrets.json); [ -n "$v" ] && echo "::add-mask::$v"
          done
          jq -r .SSH_KEY_B64 secrets.json | base64 -d > ssh_key
          chmod 600 ssh_key

      - name: Upload and start bot
        env:
          HOST: ${{ vars.VIBE_HOST || '46.225.188.115' }}
          PORT: ${{ vars.VIBE_PORT || '37621' }}
          SLUG: ${{ vars.VIBE_SLUG || 'noizoz-bot' }}
        run: |
          K="$RUNNER_TEMP/k"
          SSH="ssh -i $K/ssh_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 -p $PORT root@$HOST"
          # будим сервер, если он спит
          curl -s -o /dev/null -m 60 "https://$SLUG.thevibehosting.com/" || true
          $SSH "hostname" | grep -qx "$SLUG" || { echo "WRONG HOST"; exit 1; }
          tar czf - *.py requirements.txt | $SSH "mkdir -p /root/bot && tar xzf - -C /root/bot"
          # .env передаём через stdin, в логи он не попадает
          jq -r --arg slug "$SLUG" '"TELEGRAM_TOKEN=\(.TELEGRAM_TOKEN)\nCOARENA_API_KEY=\(.COARENA_API_KEY // "")\nWEBHOOK_URL=https://\($slug).thevibehosting.com\nPORT=80"' "$K/secrets.json" \
            | $SSH "umask 077; cat > /root/bot/.env"
          rm -f "$K/secrets.json"
          $SSH bash -s <<'EOF'
          set -e
          hostname
          if ! command -v python3 >/dev/null || ! python3 -c "import venv, ensurepip" 2>/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -q >/dev/null && apt-get install -y -q python3 python3-venv python3-pip >/dev/null
          fi
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf ]; then
            export DEBIAN_FRONTEND=noninteractive
            (apt-get update -q >/dev/null; apt-get install -y -q fonts-dejavu-core >/dev/null) || true
          fi
          cd /root/bot
          [ -d venv ] || python3 -m venv venv
          venv/bin/pip install -q --upgrade pip >/dev/null
          venv/bin/pip install -q -r requirements.txt
          # run.sh — простой foreground-запуск, как требует supervisor Vibe (перенаправление вывода в файл
          # ломало детект приложения). Один перезапуск за деплой — чтобы Telegram не включал flood control.
          cat > /root/run.sh <<'SH'
          #!/usr/bin/env bash
          cd /root/bot
          set -a; . ./.env; set +a
          exec /root/bot/venv/bin/python bot.py
          SH
          chmod +x /root/run.sh
          echo "=== ключи в .env (только имена) ==="; grep -oE '^[A-Z_]+=' /root/bot/.env | tr -d '=' || true
          # один перезапуск: убиваем старого бота, supervisor поднимет run.sh с новым кодом
          pkill -f '[b]ot\.py' || true
          echo "run.sh обновлён, бот перезапущен; проверка — через публичный адрес в шаге Check"

      - name: Check
        env:
          SLUG: ${{ vars.VIBE_SLUG || 'noizoz-bot' }}
        run: |
          # Будим контейнер публичными запросами: supervisor запускает run.sh на первом запросе,
          # холодный старт (venv + инициализация вебхука) занимает до ~90 с. 404 на / — это норма
          # (в режиме webhook обслуживается только секретный путь), 502 — ещё спит/поднимается.
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 20 "https://$SLUG.thevibehosting.com/" || echo 000)
            echo "wake $i: HTTP $code"
            case "$code" in 200|404|401) echo "бот поднялся (HTTP $code)"; exit 0;; esac
            sleep 3
          done
          echo "WARNING: бот не поднялся за ~90 с (последний код $code)"; exit 1
