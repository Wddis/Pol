# Telegram bot «Двойная резка» on GitHub Actions runners (owner's choice, 16.11.2026: no free server without
# registration was found). One run lives up to ~5.6 h; an hourly schedule keeps one run queued (concurrency group),
# so the next run starts right after the current one ends. State, logs and transcripts are kept in the Actions cache.
# Secrets (repo Settings → Secrets and variables → Actions): TG_BOT_TOKEN, TG_OWNER_ID, YT_COOKIES_B64, GEMINI_API_KEY (brain, 23.11).
name: t2x2-bot
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
concurrency:
  group: t2x2-bot
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ccr-afb88262-upss12
      - name: Dependencies cache (venv, whisper, AI model, browser, fonts)
        uses: actions/cache@v4
        with:
          path: |
            ~/venv
            ~/.cache/huggingface
            ~/.cache/ms-playwright
            ~/models
            ~/fonts
          key: t2x2-deps-v1-${{ runner.os }}
      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/t2x2work/bot_state.json
            ~/t2x2work/logs
            ~/t2x2work/jobs/*/job.json
            ~/t2x2work/jobs/*/plan*.json
            ~/t2x2work/vod*/transcript_live.txt
            ~/t2x2work/vod*/events.json
            ~/t2x2work/vod*/brain_map.json
            ~/t2x2work/cookies.enc
          key: t2x2-state-${{ github.run_id }}
          restore-keys: t2x2-state-
      - name: Install
        run: bash tools/tgbot/gha_install.sh
      - name: Run bot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN || vars.TG_BOT_TOKEN }}
          TG_OWNER_ID: ${{ secrets.TG_OWNER_ID || vars.TG_OWNER_ID }}
          YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 || vars.YT_COOKIES_B64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: bash tools/tgbot/gha_run.sh
      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/t2x2work/bot_state.json
            ~/t2x2work/logs
            ~/t2x2work/jobs/*/job.json
            ~/t2x2work/jobs/*/plan*.json
            ~/t2x2work/vod*/transcript_live.txt
            ~/t2x2work/vod*/events.json
            ~/t2x2work/vod*/brain_map.json
            ~/t2x2work/cookies.enc
          key: t2x2-state-${{ github.run_id }}
