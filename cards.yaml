# ============================================================================
#  Карточки авто-выдачи Playerok
# ============================================================================
#
#  Как это работает:
#    1. Вы выставляете товар на Playerok (текст берите из блока `listing`
#       или командой /listing <id> в Telegram-боте).
#    2. В `match` указаны ключевые слова: если название проданного товара
#       содержит ВСЕ слова одной из строк — сделка относится к этой карточке.
#       Можно вместо слов указать точные id товаров в `item_ids`.
#    3. Бот берёт из склада (`pool`) нужное число единиц (`quantity`),
#       отправляет покупателю сообщение по шаблону `delivery` и отмечает
#       сделку как «отправлено».
#
#  Типы карточек (`type`):
#    stock   — по одной строке со склада на единицу (аккаунты, ключи)
#    static  — один и тот же текст всем, склад не нужен (гайды, ссылки)
#    manual  — бот не выдаёт сам: просит у покупателя данные и зовёт вас
#
#  `pool` — имя склада. Несколько карточек могут брать из одного склада:
#  например «1 аккаунт» и «набор из 5» тратят общий склад roblox_empty.
#
#  `fields` — как разбирать строку склада. Разделитель — `separator`.
#  Строка `nick123:Pass456` при fields [login, password] даёт {login} и
#  {password} для шаблона. Строки с другим числом полей бот не примет.
#
#  Переменные в шаблонах:
#    {login} {password} ...  — поля строки склада (для quantity: 1)
#    {units}                 — все выданные строки, по одной на абзац
#    {buyer} {item} {deal_url} {quantity}
# ============================================================================

settings:
  # Отмечать сделку «отправлено» сразу после выдачи
  mark_sent: true
  # Писать покупателю, если склад пуст (и звать админа)
  out_of_stock_message: |
    Спасибо за покупку! Товар закончился буквально только что —
    продавец уже получил уведомление и выдаст его вручную в ближайшее время.
  # Слова в сообщениях покупателя, при которых бот зовёт админа
  alert_keywords: [не работает, неверный, не подходит, не заходит, проблема, верните, возврат, обман, продавец]
  # Ответ на слово «продавец» / «помощь»
  help_message: |
    Продавец получил уведомление и скоро ответит. Опишите проблему одним
    сообщением и, если можно, приложите скриншот.
  # Сообщение после подтверждения сделки покупателем
  thanks_message: |
    Спасибо, что подтвердили заказ! Будем рады отзыву ⭐ — это очень помогает.

cards:

  # --------------------------------------------------------------------------
  # ROBLOX
  # --------------------------------------------------------------------------
  - id: roblox_empty
    title: Roblox — пустой аккаунт
    type: stock
    pool: roblox_empty
    quantity: 1
    fields: [login, password]
    separator: ":"
    match:
      - [roblox, пуст]
      - [roblox, чист]
    low_stock: 5
    listing:
      name: "🟢 ПУСТОЙ АККАУНТ ROBLOX | АВТОВЫДАЧА 24/7 | Смена пароля"
      description: |
        ⚡ Моментальная автовыдача — данные придут в чат сразу после оплаты, даже ночью.

        Что вы получаете:
        • Новый пустой аккаунт Roblox (без доната, без истории)
        • Логин и пароль
        • Возможность сразу сменить ник (через Robux), пароль и привязать свою почту

        Подходит для: твинка, альта, начала игры с нуля, тестов в Roblox Studio.

        ❗ После получения сразу смените пароль и привяжите свою почту.
        ❗ Претензии по входу принимаются до подтверждения заказа.
    delivery: |
      ✅ Ваш аккаунт Roblox:

      Логин: {login}
      Пароль: {password}

      Вход: https://www.roblox.com/login
      Сразу смените пароль и привяжите свою почту: Настройки → Аккаунт.

      Если всё в порядке — подтвердите, пожалуйста, заказ 🙏

  - id: roblox_empty_x5
    title: Roblox — набор из 5 пустых аккаунтов
    type: stock
    pool: roblox_empty          # общий склад с roblox_empty
    quantity: 5
    priority: 10                # важнее, чем roblox_empty
    fields: [login, password]
    separator: ":"
    match:
      - [roblox, "5 шт"]
      - [roblox, x5]
      - [roblox, набор]
    listing:
      name: "📦 НАБОР 5 ПУСТЫХ АККАУНТОВ ROBLOX | АВТОВЫДАЧА | Выгоднее"
      description: |
        ⚡ Автовыдача 24/7: все 5 аккаунтов придут одним сообщением сразу после оплаты.

        • 5 новых пустых аккаунтов Roblox
        • Логин:пароль для каждого
        • Удобно для альтов, групп, приватных серверов

        ❗ Смените пароли сразу после получения.
    delivery: |
      ✅ Ваши {quantity} аккаунтов Roblox (логин:пароль):

      {units}

      Вход: https://www.roblox.com/login
      Сразу смените пароли. Если всё ок — подтвердите заказ 🙏

  - id: roblox_old
    title: Roblox — старый аккаунт (дата регистрации)
    type: stock
    pool: roblox_old
    quantity: 1
    fields: [login, password, year]
    separator: ":"
    match:
      - [roblox, стар]
      - [roblox, 201]           # «2016», «2018» и т.п. в названии
    low_stock: 2
    listing:
      name: "🕰 СТАРЫЙ АККАУНТ ROBLOX | Регистрация до 2020 | АВТОВЫДАЧА"
      description: |
        ⚡ Автовыдача сразу после оплаты.

        • Аккаунт Roblox с ранней датой регистрации (год указан при выдаче)
        • Логин и пароль, пустой инвентарь
        • Старая дата регистрации видна в профиле

        ❗ После входа смените пароль и привяжите свою почту.
    delivery: |
      ✅ Ваш старый аккаунт Roblox ({year} г.):

      Логин: {login}
      Пароль: {password}

      Вход: https://www.roblox.com/login
      Сразу смените пароль и привяжите почту. Подтвердите заказ, если всё ок 🙏

  - id: roblox_full
    title: Roblox — аккаунт с почтой (полный доступ)
    type: stock
    pool: roblox_full
    quantity: 1
    fields: [login, password, email, email_password]
    separator: ":"
    match:
      - [roblox, почт]
      - [roblox, полный доступ]
    low_stock: 2
    listing:
      name: "🔐 ROBLOX С ПОЧТОЙ | ПОЛНЫЙ ДОСТУП | АВТОВЫДАЧА 24/7"
      description: |
        ⚡ Автовыдача сразу после оплаты.

        • Аккаунт Roblox + доступ к привязанной почте
        • Можно восстановить и полностью сменить все данные
        • Пустой, без доната

        ❗ Сначала смените пароль от почты, затем от Roblox.
    delivery: |
      ✅ Ваш аккаунт Roblox с полным доступом:

      Roblox логин: {login}
      Roblox пароль: {password}

      Почта: {email}
      Пароль от почты: {email_password}

      Порядок: 1) смените пароль почты 2) смените пароль Roblox.
      Если всё ок — подтвердите заказ 🙏

  - id: robux_gamepass
    title: Robux через геймпасс (ручная выдача)
    type: manual
    match:
      - [robux]
      - [робукс]
    listing:
      name: "💎 ROBUX ЧЕРЕЗ ГЕЙМПАСС | Быстро | Инструкция в чате"
      description: |
        Robux зачисляются покупкой вашего геймпасса.
        После оплаты бот пришлёт инструкцию — нужно будет отправить ссылку на геймпасс.

        ⏱ Выдача обычно 5–30 минут (в рабочее время продавца).
        ❗ Robux приходят на баланс через 5–7 дней (ожидание Roblox, это нормально).
    delivery: |
      Спасибо за заказ! 💎 Чтобы получить Robux:

      1. Создайте геймпасс в любом своём плейсе (Creator Hub → Пропуска).
      2. Цена геймпасса — указана в описании товара (с учётом комиссии Roblox 30%).
      3. Пришлите сюда ССЫЛКУ на геймпасс.

      Продавец уже получил уведомление и выкупит пасс в ближайшее время.

  # --------------------------------------------------------------------------
  # ДРУГИЕ ИГРЫ
  # --------------------------------------------------------------------------
  - id: steam_empty
    title: Steam — пустой аккаунт с почтой
    type: stock
    pool: steam_empty
    quantity: 1
    fields: [login, password, email, email_password]
    separator: ":"
    match:
      - [steam, пуст]
      - [steam, чист]
    low_stock: 3
    listing:
      name: "🎮 ПУСТОЙ STEAM + РОДНАЯ ПОЧТА | АВТОВЫДАЧА | Полный доступ"
      description: |
        ⚡ Автовыдача 24/7.

        • Новый пустой аккаунт Steam
        • Родная почта с паролем — можно сменить все данные
        • Подходит под отдельный регион/библиотеку, твинк

        ❗ Сначала смените пароль от почты, затем от Steam, подключите Steam Guard.
    delivery: |
      ✅ Ваш аккаунт Steam:

      Логин Steam: {login}
      Пароль Steam: {password}

      Почта: {email}
      Пароль почты: {email_password}

      Смените пароль почты → пароль Steam → включите Steam Guard.
      Если всё ок — подтвердите заказ 🙏

  - id: genshin_starter
    title: Genshin Impact — стартовый аккаунт (реролл)
    type: stock
    pool: genshin_starter
    quantity: 1
    fields: [login, password, server, characters]
    separator: "|"             # персонажи могут содержать двоеточия → разделитель |
    match:
      - [genshin, старт]
      - [genshin, реролл]
    low_stock: 2
    listing:
      name: "✨ GENSHIN СТАРТОВЫЙ АККАУНТ | 5★ персонаж | АВТОВЫДАЧА"
      description: |
        ⚡ Автовыдача сразу после оплаты.

        • Стартовый аккаунт (реролл) с 5★ персонажем — список указан в названии
        • Логин и пароль, сервер указан при выдаче
        • Привяжите свою почту после входа

        ❗ Сервер должен совпадать с вашим — проверьте перед покупкой.
    delivery: |
      ✅ Ваш аккаунт Genshin Impact:

      Логин: {login}
      Пароль: {password}
      Сервер: {server}
      Персонажи: {characters}

      Привяжите свою почту: Паймон-меню → Настройки → Аккаунт → Центр пользователя.
      Если всё ок — подтвердите заказ 🙏

  - id: game_key
    title: Ключ / промокод (универсальная)
    type: stock
    pool: game_key
    quantity: 1
    fields: [key]
    separator: "\t"            # таб — чтобы строка ключа целиком была одним полем
    match:
      - [ключ]
      - [key]
      - [промокод]
    low_stock: 3
    listing:
      name: "🔑 КЛЮЧ АКТИВАЦИИ | АВТОВЫДАЧА 24/7"
      description: |
        ⚡ Ключ придёт в чат автоматически сразу после оплаты.
        Активируйте в течение 24 часов и подтвердите заказ.
    delivery: |
      ✅ Ваш ключ:

      {key}

      Активируйте и подтвердите заказ 🙏

  # --------------------------------------------------------------------------
  # БЕЗ СКЛАДА
  # --------------------------------------------------------------------------
  - id: roblox_guide
    title: Гайд по заработку Robux (бесконечный товар)
    type: static
    match:
      - [гайд]
    priority: 10                # в названии есть «Robux» — не путать с robux_gamepass
    listing:
      name: "📘 ГАЙД: как получать Robux легально | АВТОВЫДАЧА"
      description: |
        Пошаговый гайд: Premium-выплаты, продажа UGC, геймпассы в своём плейсе,
        DevEx. Ссылка придёт автоматически сразу после оплаты.
    delivery: |
      ✅ Ваш гайд: https://example.com/замените-на-свою-ссылку

      Если что-то непонятно — пишите сюда. Подтвердите заказ, пожалуйста 🙏
