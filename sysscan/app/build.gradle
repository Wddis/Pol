plugins { id 'com.android.application' }

android {
    namespace 'dev.sysscan'
    compileSdk 34
    defaultConfig {
        applicationId "dev.sysscan"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }
    testOptions { unitTests.returnDefaultValues = true }
    lint { abortOnError false; checkReleaseBuilds false }
    buildFeatures { buildConfig true; aidl true }
    signingConfigs {
        stable {
            storeFile file('sysscan.keystore')   // публичный debug-ключ, чтобы обновления ставились поверх
            storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.stable }
        release { minifyEnabled false; signingConfig signingConfigs.stable }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Shizuku (RikkaApps/Shizuku-API): даёт приложению права shell (uid 2000), как у ADB
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'androidx.annotation:annotation:1.8.0'
}
