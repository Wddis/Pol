# Бот ODA VPN и сервер ключей на VPS, круглосуточно (restart: always).
# Запуск — install.sh; вручную: docker compose up -d --build (с доменом: --profile https).
services:
  bot:
    build: ..
    restart: always
    env_file: .env
    environment:
      ODA_DATA_DIR: /app/data
      ODA_API_PORT: "8080"
    volumes:
      # База ключей и закрытый ключ подписи лицензий — на диске сервера (бэкап: backup.sh)
      - ./data:/app/data
    ports:
      # С доменом наружу смотрит только Caddy (HTTPS); без домена — порт 8080 открыт (ODA_BIND=0.0.0.0)
      - "${ODA_BIND:-127.0.0.1}:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # HTTPS для сервера ключей (приложению нужен https://<домен>/v1/…): сертификат Let's Encrypt — сам
  caddy:
    image: caddy:2.8.4-alpine
    profiles: ["https"]
    restart: always
    depends_on: [bot]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
