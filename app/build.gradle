plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.example.vpnapp'
    // tor-android требует compileSdk 37.1+ (Android 17); targetSdk остаётся 36
    compileSdk {
        version = release(37) {
            it.minorApiLevel = 2
        }
    }

    defaultConfig {
        applicationId = 'com.example.vpnapp'
        minSdk = 24
        targetSdk = 36
        versionCode = 27
        versionName = '0.12.3'

        // Только ARM: реальные телефоны (x86 нужен лишь эмуляторам, экономим ~15 МБ).
        // -PodaEmulator — только x86_64: проверка в эмуляторе CI без трансляции ARM-кода (Go под ней падает)
        ndk {
            abiFilters.addAll(project.hasProperty('odaEmulator') ? ['x86_64'] : ['arm64-v8a', 'armeabi-v7a'])
        }
    }

    // tun2socks собирается из исходников через NDK
    externalNativeBuild {
        ndkBuild {
            path = file('src/main/jni/Android.mk')
        }
    }

    // Свой клиент Snowflake (libsnowflake.so) и Psiphon (libpsiphon.so) запускаются
    // как программы: библиотеки должны быть распакованы из APK в папку приложения
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // Постоянная подпись ODA: новая версия ставится поверх старой. Ключ — не в репозитории (он публичный):
    // сборка в GitHub получает его у сервера бота по токену OIDC (шаг «ODA signing key» в build.yml).
    // Без ODA_KEYSTORE (сборка на своём компьютере, форк) — обычный отладочный ключ.
    def odaKeystore = System.getenv('ODA_KEYSTORE')
    signingConfigs {
        if (odaKeystore) {
            oda {
                storeFile = file(odaKeystore)
                storeType = 'pkcs12'
                storePassword = System.getenv('ODA_KEYSTORE_PASS')
                keyAlias = System.getenv('ODA_KEY_ALIAS') ?: 'oda'
                keyPassword = System.getenv('ODA_KEYSTORE_PASS')
            }
        }
    }
    buildTypes {
        debug {
            if (odaKeystore) signingConfig = signingConfigs.oda
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    // Главный экран: раскладка по пропорциям, без прокрутки на любом телефоне
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'info.guardianproject:tor-android:0.4.9.14'
    implementation 'info.guardianproject:jtorctl:0.4.5.7'
    // Мосты: snowflake, obfs4, webtunnel, meek (обход блокировки Tor)
    implementation 'com.netzarchitekten:IPtProxy:5.7.0'
}
