plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.example.vpnapp'
    // tor-android требует compileSdk 37.1+ (Android 17); targetSdk остаётся 36
    compileSdk {
        version = release(37) {
            it.minorApiLevel = 2
        }
    }

    defaultConfig {
        applicationId = 'com.example.vpnapp'
        minSdk = 24
        targetSdk = 36
        versionCode = 2
        versionName = '0.2'

        // tor-android собран только под эти ABI
        ndk {
            abiFilters.addAll(['arm64-v8a', 'armeabi-v7a', 'x86_64'])
        }
    }

    // tun2socks собирается из исходников через NDK
    externalNativeBuild {
        ndkBuild {
            path = file('src/main/jni/Android.mk')
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.webkit:webkit:1.18.0'
    implementation 'info.guardianproject:tor-android:0.4.9.14'
    implementation 'info.guardianproject:jtorctl:0.4.5.7'
}
